name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the .toc version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          toc=$(grep -oP '^## Version:\s*\K\S+' Olfato/Olfato.toc)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$toc" != "$tag" ]; then
            echo "Olfato.toc says $toc but the tag is $tag" >&2
            exit 1
          fi

      - name: Syntax-check Lua
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1 >/dev/null
          find Olfato -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build zip
        run: |
          mkdir -p dist
          cp LICENSE Olfato/LICENSE
          zip -qr dist/Olfato.zip Olfato

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Olfato
          path: dist/Olfato.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Olfato.zip
          generate_release_notes: true
          body: |
            **Bajá `Olfato.zip`** (no los *Source code*, que traen la carpeta con otro nombre).

            Abrí el zip y arrastrá la carpeta `Olfato` a `World of Warcraft/_forever_/Interface/AddOns/`. Tiene que quedar `AddOns/Olfato/Olfato.toc`. Después reiniciá el juego.
